# Preconfigured Merge Gateway routes for DSH.
#
# The row mounts `dsh-llm-direct` (the adapter code, installed as a package
# dependency of this preset) with the Merge providers already filled in. This
# preset supplies BOTH the id and the config, so `dsh-llm-direct` must NOT also
# be listed as a bundle in the profile: two entries sharing one id make the
# loader reject the whole plugin tree, which surfaces as every provider
# disappearing from the model picker.
#
# Only the API key is deployment data. It is read per request through
# `ctx.credentials.resolve(ref)` and falls back to the environment, so adding it
# takes effect on the next call — no restart:
#
#   ~/.dsh/.credentials.yaml
#     refs:
#       MERGE_GATEWAY_API_KEY: "sk-..."
#
# or simply `export MERGE_GATEWAY_API_KEY=sk-...` before launching DSH.
#
# A second Merge account is preconfigured against MERGE_GATEWAY_API_KEY_2 and
# stays out of the picker until that ref resolves.
- insert:
    - id: merge-direct
      name: dsh-llm-direct
      config:
        providers:
          merge-direct:
            displayName: Merge Gateway
            apiKeyEnv: MERGE_GATEWAY_API_KEY
            baseURL: https://api-gateway.merge.dev/v1/anthropic
            endpoint: anthropic-messages
            reasoning: high
            contextWindow: 1000000
            defaultMaxTokens: 131072
            cacheControl: none
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            models:
              - id: deepseek/deepseek-v4.1-flash-1017
                name: DeepSeek V4.1 Flash 1017 (Merge)
                contextWindow: 1000000
                maxTokens: 384000
                inputModalities: [text, image]
                reasoningEfforts:
                  off: null
                  low: low
                  medium: medium
                  high: high
                  xhigh: xhigh
                  max: max
              - id: zai/glm-5.3-flash[1m]
                name: GLM-5.3 Flash (Merge)
                contextWindow: 1000000
                maxTokens: 131072
                inputModalities: [text, image]
                reasoningEfforts:
                  off: null
                  low: low
                  medium: medium
                  high: high
                  xhigh: xhigh
                  max: max
          merge-direct-2:
            displayName: Merge Gateway (Account 2)
            apiKeyEnv: MERGE_GATEWAY_API_KEY_2
            baseURL: https://api-gateway.merge.dev/v1/anthropic
            endpoint: anthropic-messages
            reasoning: high
            contextWindow: 1000000
            defaultMaxTokens: 131072
            cacheControl: none
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            models:
              - id: deepseek/deepseek-v4.1-flash-1017
                name: DeepSeek V4.1 Flash 1017 (Merge - Account 2)
                contextWindow: 1000000
                maxTokens: 384000
                inputModalities: [text, image]
                reasoningEfforts:
                  off: null
                  low: low
                  medium: medium
                  high: high
                  xhigh: xhigh
                  max: max
              - id: zai/glm-5.3-flash[1m]
                name: GLM-5.3 Flash (Merge - Account 2)
                contextWindow: 1000000
                maxTokens: 131072
                inputModalities: [text, image]
                reasoningEfforts:
                  off: null
                  low: low
                  medium: medium
                  high: high
                  xhigh: xhigh
                  max: max
